apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: virtualnetworks.iaas.cloud.io
spec:
  group: iaas.cloud.io
  names:
    kind: VirtualNetwork
    listKind: VirtualNetworkList
    plural: virtualnetworks
    singular: virtualnetwork
    shortNames:
      - vnet
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: CIDR
          type: string
          jsonPath: .spec.cidr
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Rules
          type: integer
          jsonPath: .status.activeRuleCount
        - name: DriftHeals
          type: integer
          jsonPath: .status.driftHealsTotal
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: ["cidr"]
              properties:
                cidr:
                  type: string
                gatewayIP:
                  type: string
                enableDHCP:
                  type: boolean
                  default: true
                enableRouter:
                  type: boolean
                  default: false
                securityRules:
                  type: array
                  items:
                    type: object
                    properties:
                      direction:
                        type: string
                        enum: ["ingress", "egress"]
                        default: "ingress"
                      protocol:
                        type: string
                      portMin:
                        type: integer
                      portMax:
                        type: integer
                      remoteCIDR:
                        type: string
                      description:
                        type: string
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
